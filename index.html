<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CS2 Style FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
  canvas { display: block; }
  #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; pointer-events: none; z-index: 10; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #0f0; box-shadow: 0 0 3px #0f0; }
  #crosshair::before { width: 2px; height: 22px; left: 10px; top: 0; }
  #crosshair::after { width: 22px; height: 2px; left: 0; top: 10px; }
  #hud { position: fixed; bottom: 20px; right: 30px; color: #fff; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; user-select: none; }
  #hud .reserve { color: #aaa; font-size: 22px; }
  #hud .label { font-size: 14px; color: #ccc; letter-spacing: 2px; }
  #hp { position: fixed; bottom: 20px; left: 30px; color: #fff; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; }
  #hp .heart { color: #e33; }
  #info { position: fixed; top: 15px; left: 15px; color: #fff; font-size: 13px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 4px; z-index: 10; line-height: 1.6; }
  #info b { color: #ffcc00; }
  #hitmarker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 18px; height: 18px; pointer-events: none; z-index: 11; opacity: 0; transition: opacity 0.1s; }
  #hitmarker::before, #hitmarker::after { content: ''; position: absolute; background: #fff; }
  #hitmarker::before { width: 2px; height: 18px; left: 8px; }
  #hitmarker::after { width: 18px; height: 2px; top: 8px; }
  #hitmarker.active { opacity: 1; }
  #reloadText { position: fixed; top: 60%; left: 50%; transform: translateX(-50%); color: #ffcc00; font-size: 20px; font-weight: bold; display: none; text-shadow: 2px 2px 4px #000; z-index: 10; }
  #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #222; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 24px; z-index: 100; transition: opacity 0.5s; }
</style>
</head>
<body>
<div id="loading">Загрузка модели...</div>
<div id="crosshair"></div>
<div id="hitmarker"></div>
<div id="hud">
  <div class="label">AK-47</div>
  <span class="ammo" id="ammo">30</span>
  <span class="reserve">/ <span id="reserve">90</span></span>
</div>
<div id="hp"><span class="heart">❤</span> <span id="hpVal">100</span></div>
<div id="info">
  <b>WASD</b> — движение · <b>Мышь</b> — обзор · <b>ЛКМ</b> — стрельба<br>
  <b>R</b> — перезарядка · <b>Shift</b> — бег · <b>Space</b> — прыжок
</div>
<div id="reloadText">ПЕРЕЗАРЯДКА...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a7c4);
scene.fog = new THREE.Fog(0x87a7c4, 30, 90);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444466, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d0, 1.8);
sun.position.set(20, 40, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 150;
scene.add(sun);

const mapGroup = new THREE.Group();
scene.add(mapGroup);

function makeTexture(color, size = 128, noise = 20, repeat = 4) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color; ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * noise;
    img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat); tex.anisotropy = 8;
  return tex;
}

const groundMat = new THREE.MeshStandardMaterial({ map: makeTexture('#c9a876', 256, 25, 20), roughness: 0.95 });
const wallMat = new THREE.MeshStandardMaterial({ map: makeTexture('#b8956a', 256, 20, 2), roughness: 0.9 });
const crateMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x556070, roughness: 0.4, metalness: 0.8 });

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
mapGroup.add(ground);

const colliders = [];
function addWall(x, z, w, d, h = 6) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  wall.position.set(x, h/2, z); wall.castShadow = wall.receiveShadow = true;
  mapGroup.add(wall); colliders.push(new THREE.Box3().setFromObject(wall));
}
addWall(0, -40, 80, 2, 10); addWall(0, 40, 80, 2, 10);
addWall(-40, 0, 2, 80, 10); addWall(40, 0, 2, 80, 10);
addWall(-15, -10, 2, 20, 5); addWall(15, 10, 2, 20, 5);
addWall(-5, 15, 20, 2, 5); addWall(10, -20, 2, 15, 5);
addWall(-25, 20, 15, 2, 5); addWall(25, -15, 15, 2, 5);
addWall(0, 0, 10, 2, 4);

function addCrate(x, z, s = 2, y = null) {
  const crate = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), crateMat);
  crate.position.set(x, y ?? s/2, z); crate.castShadow = crate.receiveShadow = true;
  mapGroup.add(crate); colliders.push(new THREE.Box3().setFromObject(crate));
}
addCrate(8, 8, 2); addCrate(10, 8, 2); addCrate(8, 10, 2);
addCrate(-12, 8, 2.5); addCrate(-12, 8, 2, 2.5);
addCrate(-22, -8, 2); addCrate(20, 18, 2); addCrate(-8, -18, 2.5); addCrate(5, 25, 2);

for (let i = 0; i < 5; i++) {
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.6, 16), metalMat);
  barrel.position.set(-30 + i*3, 0.8, -30); barrel.castShadow = barrel.receiveShadow = true;
  mapGroup.add(barrel); colliders.push(new THREE.Box3().setFromObject(barrel));
}

const weaponGroup = new THREE.Group();
camera.add(weaponGroup);
scene.add(camera);

const matWood = new THREE.MeshStandardMaterial({ color: 0x6b3410, roughness: 0.7 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.35, metalness: 0.85 });
const matSteelDark = new THREE.MeshStandardMaterial({ color: 0x1a1a1e, roughness: 0.3, metalness: 0.9 });

const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.13, 0.55), matSteel);
receiver.position.set(0, 0, -0.15); weaponGroup.add(receiver);
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.5, 12), matSteelDark);
barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.02, -0.65); weaponGroup.add(barrel);
const gasTube = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.4, 10), matSteel);
gasTube.rotation.x = Math.PI/2; gasTube.position.set(0, 0.075, -0.5); weaponGroup.add(gasTube);
const stock = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.14, 0.35), matWood);
stock.position.set(0, -0.01, 0.28); weaponGroup.add(stock);
const grip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.18, 0.09), matWood);
grip.position.set(0, -0.16, 0.08); grip.rotation.x = 0.25; weaponGroup.add(grip);
const magCurve = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.22, 0.1), matSteelDark);
magCurve.position.set(0, -0.2, -0.1); magCurve.rotation.x = -0.15; weaponGroup.add(magCurve);
const magCurve2 = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.12, 0.1), matSteelDark);
magCurve2.position.set(0, -0.32, -0.14); magCurve2.rotation.x = -0.5; weaponGroup.add(magCurve2);
const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.28), matWood);
handguard.position.set(0, 0.01, -0.52); weaponGroup.add(handguard);
const rearSight = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 0.04), matSteelDark);
rearSight.position.set(0, 0.08, -0.35); weaponGroup.add(rearSight);
const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.05, 0.02), matSteelDark);
frontSight.position.set(0, 0.085, -0.82); weaponGroup.add(frontSight);
const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.06, 12), matSteelDark);
muzzle.rotation.x = Math.PI/2; muzzle.position.set(0, 0.02, -0.88); weaponGroup.add(muzzle);

weaponGroup.position.set(0.28, -0.28, -0.55);
weaponGroup.rotation.y = -0.05;

const flashLight = new THREE.PointLight(0xffaa00, 0, 8, 2);
flashLight.position.set(0, 0.02, -0.95); weaponGroup.add(flashLight);
const flash = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffee88, transparent: true, opacity: 0 }));
flash.position.set(0, 0.02, -0.95); weaponGroup.add(flash);

// ЗАГРУЗКА МОДЕЛИ ПО ПРЯМОЙ ССЫЛКЕ
const enemies = [];
// Вшитая ссылка на твою модель
const MODEL_URL = 'https://corsproxy.io/?https://github.com/m39463664-ship-it/my-fps-game/raw/refs/heads/main/model.glb';

const loader = new GLTFLoader();
loader.load(MODEL_URL, (gltf) => {
  document.getElementById('loading').style.opacity = 0;
  setTimeout(() => document.getElementById('loading').remove(), 500);
  
  const loadedModel = gltf.scene;
  const box = new THREE.Box3().setFromObject(loadedModel);
  const size = box.getSize(new THREE.Vector3());
  const scaleFactor = 1.8 / size.y;
  loadedModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
  
  const scaledBox = new THREE.Box3().setFromObject(loadedModel);
  const offsetY = scaledBox.getSize(new THREE.Vector3()).y / 2;

  loadedModel.traverse((child) => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
  });

  const spawnPoints = [[0, -20], [20, 20], [-20, 15], [15, -25], [-25, -20]];
  
  spawnPoints.forEach((pos) => {
    const enemyRoot = loadedModel.clone();
    enemyRoot.position.set(pos[0], offsetY, pos[1]);
    
    let headMesh = null;
    enemyRoot.traverse(c => { if (c.isMesh && c.name.toLowerCase().includes('head')) headMesh = c; });
    
    enemyRoot.userData = { hp: 100, alive: true, head: headMesh, bob: Math.random() * Math.PI * 2 };
    
    scene.add(enemyRoot);
    enemies.push(enemyRoot);
  });
}, undefined, (error) => {
  console.error('Ошибка загрузки модели:', error);
  document.getElementById('loading').textContent = 'Ошибка! Не удалось загрузить модель из интернета.';
});

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playShotSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
  gain.gain.setValueAtTime(0.35, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(gain).connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.16);
  const bufferSize = audioCtx.sampleRate * 0.1;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
  const ng = audioCtx.createGain(); ng.gain.setValueAtTime(0.25, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  noise.connect(ng).connect(audioCtx.destination); noise.start(t);
}
function playHitSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(900, t); osc.frequency.exponentialRampToValueAtTime(1400, t + 0.05);
  g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  osc.connect(g).connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.09);
}

const keys = {};
const player = { pos: new THREE.Vector3(0, 1.7, 30), vel: new THREE.Vector3(), onGround: true, hp: 100 };
let yaw = 0, pitch = 0;
const mouseSens = 0.0022;

document.addEventListener('mousemove', (e) => {
  if (!document.pointerLockElement) return;
  yaw -= e.movementX * mouseSens; pitch -= e.movementY * mouseSens;
  pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
});
document.addEventListener('click', () => {
  if (!document.pointerLockElement) { renderer.domElement.requestPointerLock(); initAudio(); }
});
document.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'KeyR') reload(); });
document.addEventListener('keyup', (e) => keys[e.code] = false);

const weapon = { magSize: 30, ammo: 30, reserve: 90, fireRate: 0.1, lastShot: 0, reloading: false, recoil: 0, basePos: new THREE.Vector3(0.28, -0.28, -0.55), baseRot: new THREE.Euler(0, -0.05, 0) };
const ammoEl = document.getElementById('ammo'), reserveEl = document.getElementById('reserve'), reloadText = document.getElementById('reloadText');

function updateHUD() { ammoEl.textContent = weapon.ammo; reserveEl.textContent = weapon.reserve; }
function reload() {
  if (weapon.reloading || weapon.ammo === weapon.magSize || weapon.reserve === 0) return;
  weapon.reloading = true; reloadText.style.display = 'block';
  setTimeout(() => {
    const need = weapon.magSize - weapon.ammo; const take = Math.min(need, weapon.reserve);
    weapon.ammo += take; weapon.reserve -= take; weapon.reloading = false; reloadText.style.display = 'none'; updateHUD();
  }, 1800);
}

const raycaster = new THREE.Raycaster();
const screenCenter = new THREE.Vector2(0, 0);

function shoot() {
  const now = performance.now() / 1000;
  if (weapon.reloading || now - weapon.lastShot < weapon.fireRate) return;
  if (weapon.ammo <= 0) { if (weapon.reserve > 0) reload(); return; }
  weapon.lastShot = now; weapon.ammo--; updateHUD(); playShotSound();
  weapon.recoil = 0.08; pitch += 0.012 + Math.random() * 0.008; yaw += (Math.random() - 0.5) * 0.006;
  flash.material.opacity = 1; flashLight.intensity = 3;
  raycaster.setFromCamera(screenCenter, camera); raycaster.far = 200;
  const targets = [...enemies, ...mapGroup.children];
  const hits = raycaster.intersectObjects(targets, true);
  if (hits.length > 0) {
    const hit = hits[0];
    let obj = hit.object; let enemyRoot = null;
    while (obj) { if (enemies.includes(obj)) { enemyRoot = obj; break; } obj = obj.parent; }
    if (enemyRoot && enemyRoot.userData.alive) {
      const isHead = enemyRoot.userData.head && (hit.object === enemyRoot.userData.head || hit.object.parent === enemyRoot.userData.head);
      const dmg = isHead ? 100 : 34;
      enemyRoot.userData.hp -= dmg;
      document.getElementById('hitmarker').classList.add('active');
      setTimeout(() => document.getElementById('hitmarker').classList.remove('active'), 80);
      playHitSound();
      if (enemyRoot.userData.hp <= 0) {
        enemyRoot.userData.alive = false;
        let fallTime = 0;
        const fallInterval = setInterval(() => {
          fallTime += 0.05; enemyRoot.rotation.z = Math.min(fallTime * 3, Math.PI/2);
          if (fallTime > 1) clearInterval(fallInterval);
        }, 16);
        setTimeout(() => {
          const spots = [[0,-20],[20,20],[-20,15],[15,-25],[-25,-20],[30,0],[-30,5],[0,25]];
          const s = spots[Math.floor(Math.random()*spots.length)];
          enemyRoot.position.set(s[0], enemyRoot.position.y, s[1]); enemyRoot.rotation.z = 0;
          enemyRoot.userData.hp = 100; enemyRoot.userData.alive = true;
        }, 4000);
      }
    } else {
      const hole = new THREE.Mesh(new THREE.CircleGeometry(0.06, 8), new THREE.MeshBasicMaterial({ color: 0x111111 }));
      hole.position.copy(hit.point).addScaledVector(hit.face.normal, 0.01);
      hole.lookAt(hit.point.clone().add(hit.face.normal)); scene.add(hole);
      setTimeout(() => { scene.remove(hole); hole.geometry.dispose(); }, 8000);
    }
  }
}

let isMouseDown = false, shootInterval = null;
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 0 && document.pointerLockElement) {
    isMouseDown = true; shoot();
    shootInterval = setInterval(() => { if (isMouseDown) shoot(); }, weapon.fireRate * 1000);
  }
});
document.addEventListener('mouseup', (e) => { if (e.button === 0) { isMouseDown = false; clearInterval(shootInterval); } });

const playerRadius = 0.4; const playerHeight = 1.7;
function checkCollision(pos) {
  const box = new THREE.Box3(
    new THREE.Vector3(pos.x - playerRadius, 0.1, pos.z - playerRadius),
    new THREE.Vector3(pos.x + playerRadius, playerHeight, pos.z + playerRadius)
  );
  for (const c of colliders) { if (box.intersectsBox(c)) return c; }
  return null;
}
function moveWithCollisions(dx, dz) {
  const testX = player.pos.clone(); testX.x += dx;
  if (!checkCollision(testX)) player.pos.x = testX.x;
  const testZ = player.pos.clone(); testZ.z += dz;
  if (!checkCollision(testZ)) player.pos.z = testZ.z;
}

const clock = new THREE.Clock();
let bobTime = 0, weaponKick = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  camera.rotation.y = yaw; camera.rotation.x = pitch;
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  let move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  const running = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = running ? 9 : 5.5;
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(speed * dt); moveWithCollisions(move.x, move.z);
    bobTime += dt * (running ? 14 : 10);
  }
  if (keys['Space'] && player.onGround) { player.vel.y = 6.5; player.onGround = false; }
  player.vel.y -= 18 * dt; player.pos.y += player.vel.y * dt;
  if (player.pos.y <= playerHeight) { player.pos.y = playerHeight; player.vel.y = 0; player.onGround = true; }
  camera.position.copy(player.pos);

  const bobX = Math.sin(bobTime) * 0.012; const bobY = Math.abs(Math.cos(bobTime)) * 0.01;
  weaponKick *= 0.85;
  weaponGroup.position.x = weapon.basePos.x + bobX;
  weaponGroup.position.y = weapon.basePos.y - bobY + weaponKick * 0.05;
  weaponGroup.position.z = weapon.basePos.z + weaponKick * 0.15;
  weaponGroup.rotation.x = weapon.baseRot.x + weaponKick * 0.3;
  weaponGroup.rotation.y = weapon.baseRot.y + bobX * 0.5;

  flash.material.opacity *= 0.7; flashLight.intensity *= 0.6;
  for (const e of enemies) {
    if (!e.userData.alive) continue;
    e.userData.bob += dt * 2; e.rotation.x = Math.sin(e.userData.bob) * 0.01;
  }
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
updateHUD();
</script>
</body>
</html>
